name: Sync upstream and publish LazyCat application

on:
  # Daily upstream check; GitHub Actions cron is UTC (CST = UTC+8)
  schedule:
    - cron: "23 2 * * *"
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/lazycat-action.yml
      - .github/workflows/lazycat.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
      - scripts/build-upstream.sh
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # The upstream repo has no release tags, so track the default-branch commit.
  # The store and the Action require SemVer in package.yml; every upstream
  # change bumps the patch version and records the upstream short SHA in the
  # version suffix metadata comment + changelog line, so each build stays
  # traceable to an exact upstream revision.
  sync-upstream:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync upstream version (default-branch commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api repos/designfuchen/word-atlas/commits/main --jq '.sha')"
          SHORT="${SHA::10}"
          DATE="$(gh api repos/designfuchen/word-atlas/commits/main --jq '.commit.committer.date' | cut -c1-10)"
          CURRENT="$(sed -n 's/^version: *//p' package.yml)"
          RECORDED="$(sed -n 's/^# upstream: *//p' package.yml)"
          echo "upstream=$SHORT ($DATE) recorded=$RECORDED current=$CURRENT"
          if [ "$SHORT" = "$RECORDED" ]; then
            echo "no update needed"
            exit 0
          fi
          MAJOR="$(cut -d. -f1 <<<"$CURRENT")"
          MINOR="$(cut -d. -f2 <<<"$CURRENT")"
          PATCH="$(cut -d. -f3 <<<"$CURRENT")"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^version: .*/version: $NEW/" package.yml
          sed -i "s|^# upstream: .*|# upstream: $SHORT|" package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.yml
          git commit -m "chore: bump to $NEW (upstream word-atlas $SHORT, $DATE)"
          git push

  lazycat:
    # schedule 事件只做上游检查；发布由 sync 产生的 push 触发
    if: github.event_name != 'schedule'
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      dry-run: ${{ github.event_name == 'pull_request' }}
      versioned-release-asset: true
    # 仅发布喵喵商店（MiaoMiao private store）；官方平台不发布，LZC_API_TOKEN 不映射
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
